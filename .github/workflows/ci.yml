name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: go test ./...
      - run: npm run test:node
      - name: Build CLI
        shell: bash
        run: |
          mkdir -p dist
          version="$(node -p "require('./package.json').version")"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          ldflags="-s -w -X github.com/follenfang/wowdoc/internal/app.Version=${version} -X github.com/follenfang/wowdoc/internal/app.Commit=${GITHUB_SHA}"
          go build -trimpath -ldflags "$ldflags" -o "dist/wowdoc${suffix}" ./cmd/wowdoc
      - name: Pack npm
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) package=wowdoc-linux-x64 ;;
            Linux-ARM64) package=wowdoc-linux-arm64 ;;
            Windows-X64) package=wowdoc-win32-x64 ;;
            macOS-X64) package=wowdoc-darwin-x64 ;;
            macOS-ARM64) package=wowdoc-darwin-arm64 ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          export WOWDOC_PLATFORM_PACKAGE="$package"
          case "$package" in
            wowdoc-win32-x64) cp dist/wowdoc.exe dist/wowdoc-windows-amd64.exe ;;
            wowdoc-linux-x64) cp dist/wowdoc dist/wowdoc-linux-amd64 ;;
            wowdoc-linux-arm64) cp dist/wowdoc dist/wowdoc-linux-arm64 ;;
            wowdoc-darwin-x64) cp dist/wowdoc dist/wowdoc-darwin-amd64 ;;
            wowdoc-darwin-arm64) cp dist/wowdoc dist/wowdoc-darwin-arm64 ;;
          esac
          node scripts/prepare-platform-packages.mjs
          npm pack "./packages/$package" --pack-destination dist
          npm pack --ignore-scripts
      - name: Install packed npm package
        shell: bash
        run: npm install -g ./dist/follenfang-wowdoc-*.tgz ./follenfang-wowdoc-*.tgz
      - name: Run installed commands
        shell: bash
        env:
          WOWDOC_HOME: ${{ runner.temp }}/wowdoc-fixture
        run: |
          test "$(wowdoc --version)" = "wowdoc $(node -p "require('./package.json').version")"
          wowdoc init --help
          wowdoc doctor
          wowdoc index build --source wow-ui-source --product retail --source-path testdata/sources/valid-retail

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert CLI-only production tree
        run: |
          test ! -e cmd/wowdoc-server
          test ! -e internal/http
          test ! -e internal/stdio
          test ! -e internal/shared/mcp
          ! grep -RniE 'modelcontextprotocol|mcp stdio|mcp http' --include='*.go' cmd internal go.mod
      - name: Check npm contents
        run: |
          npm pack --ignore-scripts
          tar -tf follenfang-wowdoc-*.tgz > package-files.txt
          ! grep -E 'wowdoc-server|Dockerfile|analyze/|repositories/|indexes/|\.exe$' package-files.txt
