      truncated: false
  - id: A24
    source: specs/addon-validation/spec.md
    text: "`matchedTag` 在精确 Tag/版本匹配时返回规范 Tag，`resolvedCommit` 为对应的 40 位不可变
      Commit。没有匹配 Tag 的合法 Commit 选择可返回空字符串，但字段仍存在。"
    result: passed
    reason:
