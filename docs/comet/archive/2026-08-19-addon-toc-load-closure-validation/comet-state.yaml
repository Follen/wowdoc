      truncated: false
  - id: A25
    source: specs/addon-validation/spec.md
    text: diagnostics 始终为 JSON 数组，即使为空也输出 `[]`。每条 diagnostic 始终包含
      severity、code、file、line、column、message、evidence；未知行列使用 0，evidence
