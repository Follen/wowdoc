acceptance:
  - id: A1
    source: brief.md
    text: "给定包含 209 个 Lua、但 `_Mists.toc` 闭包仅有 25 个 Lua 的目录，带 `--toc` 返回 `checkedLua:
      25`，闭包外文件不产生诊断。"
    result: passed
    reason:
      text: TOC closure and CLI tests prove only loaded Lua is counted;
        closure-external broken Lua is excluded.
      truncated: false
  - id: A2
    source: brief.md
    text: XML A include 子目录 XML B，B 的相对 `Script file="../code.lua"` 按 B
      所在目录解析；输出闭包顺序和 TOC/XML 来源。
    result: passed
    reason:
      text: Closure tests cover nested XML Include/Script and current-XML-relative
        paths.
      truncated: false
  - id: A3
    source: brief.md
    text: 同一文件被多个入口引用时仅验证一次，`loadedBy` 保留全部来源，并产生稳定重复引用诊断；循环引用不会递归失控。
    result: passed
    reason:
      text: Duplicate and cycle tests prove deduplication, all loadedBy sources, and
        termination.
      truncated: false
  - id: A4
    source: brief.md
    text: 缺失文件、无法解析 XML 和逃逸根目录都返回包含 severity/code/file/line/column/message/evidence
      的精确诊断。
    result: passed
    reason:
      text: Failure tests assert structured missing/XML/escape diagnostics with stable
        evidence fields.
      truncated: false
  - id: A5
    source: brief.md
    text: 无诊断、无动态项时 `diagnostics` 与 `unresolved` 均为 `[]`，不为 null 或缺失。
    result: passed
    reason:
      text: Closure, query, matrix, and CLI JSON tests assert non-null empty arrays.
      truncated: false
  - id: A6
    source: brief.md
    text: '精确 `--ref 5.5.4` 返回 `requestedRef: "5.5.4"`、`matchedTag: "5.5.4"` 和 40 位
      `resolvedCommit`。'
    result: passed
    reason:
      text: CLI snapshot fixture asserts requestedRef, exact matchedTag, and
        40-character resolvedCommit.
      truncated: false
  - id: A7
    source: brief.md
    text: 三目标矩阵区分共同事实、签名/参数差异、目标独有文件与问题、Interface 不匹配以及动态无法判定项。
    result: passed
    reason:
      text: Three-target unit and CLI tests cover signatures, target-only
        files/issues, Interface, and unresolved.
      truncated: false
  - id: A8
    source: brief.md
    text: 不带 `--toc` 的 `validate` 保持递归 Lua 计数、Lua 语法诊断和原有兼容字段。
    result: passed
    reason:
      text: Legacy CLI test proves recursive Lua count, syntax diagnostic, ref, and no
        snapshot requirement.
      truncated: false
  - id: A9
    source: brief.md
    text: Windows 反斜杠、空格目录和磁盘大小写差异均能稳定解析，输出路径统一为 AddOn 根目录相对的 `/` 路径。
    result: passed
    reason:
      text: Closure tests cover Windows separators, spaces, case-insensitive lookup,
        and normalized slash output.
      truncated: false
  - id: A10
    source: specs/addon-validation/spec.md
    text: wowdoc 对本地 AddOn 做不执行代码的静态验证。验证可使用整个目录的兼容模式，也可使用单个 TOC
      的真实有序加载闭包模式；所有版本兼容性证据来自用户选择的已就绪 wowdoc snapshot，并绑定 source、product、精确 Tag
      与不可变 Commit。
    result: passed
    reason:
      text: TOC mode selects one ready immutable snapshot before static validation.
      truncated: false
  - id: A11
    source: specs/addon-validation/spec.md
    text: 静态验证只陈述能由源文件和目标 snapshot 证明的事实。动态构造的 API、事件、模板、Mixin、Frame 类型或路径进入
      unresolved，不得被报告为确定兼容或不兼容；验证成功表示“在所覆盖的静态检查中未发现 error”，不表示保证可在游戏内完美运行。
    result: passed
    reason:
      text: Dynamic references are unresolved and docs explicitly reject runtime
        guarantees.
      truncated: false
  - id: A12
    source: specs/addon-validation/spec.md
    text: "`wowdoc validate --path <addon-dir> --source <source> --product <product>
      --ref <ref>` 保持现有递归 Lua 验证行为。它递归扫描 AddOn 目录内 Lua，返回既有
      `path`、`sourceId`、`product`、`ref`、`checkedLua`、`valid` 和 `diagnostics`
      字段；新增证据字段不得移除或改变这些字段的含义。"
    result: passed
    reason:
      text: No-TOC branch retains original WalkDir Lua parser and legacy fields.
      truncated: false
  - id: A13
    source: specs/addon-validation/spec.md
    text: 提供 `--toc <toc-file>` 时，TOC 路径相对 `--path` 解析；绝对路径仅在最终文件位于 AddOn
      根目录内时接受。此模式不得扫描闭包外 Lua/XML。
    result: passed
    reason:
      text: BuildClosure resolves relative/contained absolute TOC and scans no
        external files.
      truncated: false
  - id: A14
    source: specs/addon-validation/spec.md
    text: "TOC 解析器按文本顺序读取非空、非注释文件行，并保留行号。元数据使用 `## Key: Value` 解析，至少提取
      `Interface`；普通 `#` 注释不进入闭包。UTF-8 BOM 与 CRLF 必须支持。"
    result: passed
    reason:
      text: TOC parser tests cover order, Interface, BOM, CRLF, blank lines, and
        comments.
      truncated: false
  - id: A15
    source: specs/addon-validation/spec.md
    text: TOC 和 XML 实际加载文件类型为 Lua 与 XML。每个 Lua 进入闭包并做语法与静态兼容性分析；每个 XML 进入闭包、做标准 XML
      token 解析，并按文档顺序递归处理大小写不敏感的 `Script file="..."` 与 `Include file="..."`。XML
      相对路径以当前 XML 所在目录为基准。元素或属性的 namespace 前缀不得改变本地名匹配。
    result: passed
    reason:
      text: Standard XML decoder recursively processes case-insensitive
        namespace-local Script/Include references.
      truncated: false
  - id: A16
    source: specs/addon-validation/spec.md
    text: 闭包第一次发现文件时确定 loadOrder 并立即按深度优先的客户端加载顺序展开；后续重复引用不再次验证或展开，但把来源追加到同一闭包项的
      loadedBy。每个来源包含 file、line 和 kind。路径输出统一为 AddOn 根目录相对、正斜杠分隔的形式。
    result: passed
    reason:
      text: Zero-based discovery order and loadedBy arrays are asserted in closure and
        CLI tests.
      truncated: false
  - id: A17
    source: specs/addon-validation/spec.md
    text: 解析必须兼容 Windows
      反斜杠、带空格目录和大小写不敏感磁盘上的大小写差异。每个候选路径经过清理、绝对化和根目录包含关系检查；`..`、绝对路径、符号链接或挂载点不得使加载目标逃逸
      AddOn 根目录。
    result: passed
    reason:
      text: Lexical, absolute, case-resolved, and evaluated-symlink root containment
        checks are implemented and tested where permissions allow.
      truncated: false
  - id: A18
    source: specs/addon-validation/spec.md
    text: 缺失文件、无法解析 XML、Lua 语法错误、路径逃逸和不支持加载类型产生 error。重复引用与循环引用产生
      warning；循环边被记录但不继续递归。错误不导致进程崩溃，闭包解析继续处理可安全处理的其余入口。
    result: passed
    reason:
      text: Error/warning severity policy and continued safe traversal are covered by
        failure fixtures.
      truncated: false
  - id: A19
    source: specs/addon-validation/spec.md
    text: 成功执行的 envelope 为 `{"ok":true,"data":...}`。TOC 模式 data 至少稳定包含：
    result: passed
    reason:
      text: RunWowdoc integration tests deserialize successful JSON envelopes.
      truncated: false
  - id: A20
    source: specs/addon-validation/spec.md
    text: "`valid`：不存在 error 级 diagnostic 时为 true；"
    result: passed
    reason:
      text: Validator valid is derived only from error-severity diagnostics.
      truncated: false
  - id: A21
    source: specs/addon-validation/spec.md
    text: "`sourceId`、`product`、`requestedRef`、`matchedTag`、`resolvedCommit`；"
    result: passed
    reason:
      text: Result schema and CLI fixture assert source/product/ref/tag/commit
        evidence.
      truncated: false
  - id: A22
    source: specs/addon-validation/spec.md
    text: "`path`、`toc`、`checkedLua`、`checkedXml`；"
    result: passed
    reason:
      text: Result schema and tests assert path/toc/Lua/XML counts.
      truncated: false
  - id: A23
    source: specs/addon-validation/spec.md
    text: "`loadClosure`、`diagnostics`、`unresolved`、`coverage`。"
    result: passed
    reason:
