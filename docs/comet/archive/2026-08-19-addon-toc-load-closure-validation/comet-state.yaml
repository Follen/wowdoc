      truncated: false
  - id: A28
    source: specs/addon-validation/spec.md
    text: coverage 始终为对象，提供静态分析检查数量和确定/未解析数量，但不得暗示运行时覆盖率。
    result: passed
    reason:
      text: Coverage reports checked/resolved/unresolved static evidence counts.
      truncated: false
  - id: A29
    source: specs/addon-validation/spec.md
    text: Lua 使用 AST 提取可静态确定的函数调用、RegisterEvent/RegisterUnitEvent 事件名、CreateFrame
      Frame 类型与模板、CreateFromMixins Mixin，以及相关字符串字面量。XML 提取元素 Frame 类型、inherits
      模板/Mixin 和脚本处理器中的 Lua。动态目标统一进入 unresolved。
    result: passed
    reason:
      text: AST/XML analyzer tests cover APIs, events, CreateFrame, templates, Mixins,
        frame types, and dynamic expressions.
      truncated: false
  - id: A30
    source: specs/addon-validation/spec.md
    text: 目标 snapshot 的现有共享事实和分支成员索引是唯一兼容性真相来源。验证层通过查询接口读取 API/API 签名、事件/参数、XML
      节点、Mixin 与 Frame 类型，不复制索引数据库。索引器应从官方生成文档保存 API 与事件的参数签名，以支持目标间签名比较；索引
      schema 变化必须使旧 snapshot 明确要求重建。
    result: passed
    reason:
      text: Compatibility lookup joins existing snapshot/content facts and generated
        signatures; schema bump invalidates old indexes.
      truncated: false
  - id: A31
    source: specs/addon-validation/spec.md
    text: 可证明某符号在目标 snapshot 中不存在时产生兼容性 error；存在时记录
      coverage，不产生“保证运行”的成功声明。存在多个候选或证据不足时进入 unresolved。
    result: passed
    reason:
      text: Authoritative absence becomes error while ambiguous globals/Mixins/frame
        types remain unresolved.
      truncated: false
  - id: A32
    source: specs/addon-validation/spec.md
    text: TOC Interface 元数据与目标 snapshot 中可证明的目标构建 Interface 比较；不匹配产生稳定诊断，无法取得目标
