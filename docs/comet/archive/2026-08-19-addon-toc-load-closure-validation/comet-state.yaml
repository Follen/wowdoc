      truncated: false
  - id: A27
    source: specs/addon-validation/spec.md
    text: loadClosure 始终为 JSON 数组。每项包含 path、type、loadedBy 和 loadOrder；type 为 lua 或
      xml；loadedBy 始终为数组。checkedLua/checkedXml 分别等于闭包中对应类型的去重项数。
    result: passed
    reason:
      text: LoadFile schema and closure tests assert type, loadedBy, zero-based order,
