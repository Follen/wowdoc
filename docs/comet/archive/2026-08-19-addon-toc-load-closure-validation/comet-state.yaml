      truncated: false
  - id: A26
    source: specs/addon-validation/spec.md
    text: unresolved 始终为 JSON 数组。每项包含 kind、expression、file、line、column、reason 和
      evidence。动态引用不得同时产生“确定不存在”诊断。
    result: passed
    reason:
      text: Unresolved schema is stable; dynamic calls/events/templates remain
